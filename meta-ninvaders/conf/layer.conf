# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes/*.bb \
            ${LAYERDIR}/recipes/*.bbappend"

BBFILE_COLLECTIONS += "meta-ninvaders"
BBFILE_PATTERN_meta-ninvaders = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ninvaders = "6"

LAYERDEPENDS_meta-ninvaders = "core"
LAYERSERIES_COMPAT_meta-ninvaders = "scarthgap"
